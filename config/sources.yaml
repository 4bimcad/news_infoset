# Конфиг источников новостей для infoset.org.pe
#
# feed_url: null  -> нужно определить через discover_feeds.py
# feed_url: "..." -> подтверждённый рабочий RSS
#
# category:
#   noticias    - общие новости сектора (проекты, инвестиции, производство)
#   normativa   - законы, decretos, resoluciones (MINEM, SUNAT, SUNAFIL, OEFA)
#   internacional - зарубежные отраслевые новости

sources:
  # ---------- ПЕРУ: отраслевые СМИ ----------
  - id: rumbominero
    name: "Rumbo Minero"
    country: PE
    category: noticias
