# Конфиг источников новостей для infoset.org.pe
#
# feed_url: null  -> нужно определить через discover_feeds.py
# feed_url: "..." -> подтверждённый рабочий RSS
#
# category:
#   noticias    - общие новости сектора (проекты, инвестиции, производство)
#   normativa   - законы, decretos, resoluciones (MINEM, SUNAT, SUNAFIL, OEFA)
#   internacional - зарубежные отраслевые новости

sources:
  # ---------- ПЕРУ: отраслевые СМИ ----------
  - id: rumbominero
    name: "Rumbo Minero"
    country: PE
    category: noticias
    homepage: "https://www.rumbominero.com"
    feed_url: "https://www.rumbominero.com/category/peru/noticias/mineria/feed/"

  - id: energiminas
    name: "Energiminas"
    country: PE
    category: noticias
    homepage: "https://energiminas.com"
    feed_url: "https://energiminas.com/feed/"

  - id: proactivo
    name: "Proactivo"
    country: PE
    category: noticias
    homepage: "https://proactivo.com.pe"
    feed_url: "https://proactivo.com.pe/feed/"

  # ---------- ПЕРУ: Google News (агрегатор -- ловит СМИ, которых нет в списке) ----------
  # Официально Google это не документирует, но формат стабилен и бесплатен,
  # без API-ключа. source в каждой новости будет РЕАЛЬНЫМ издательством
  # (La República, Perú21, RPP и т.д.), а не фиксированным id -- см.
  # dynamic_source в fetch_news.py.
  - id: google_news_mineria
    name: "Google News - minería Perú"
    country: PE
    category: noticias
    homepage: "https://news.google.com/rss/search?q=%22miner%C3%ADa+Per%C3%BA%22&hl=es-419&gl=PE&ceid=PE:es"
    feed_url: "https://news.google.com/rss/search?q=%22miner%C3%ADa+Per%C3%BA%22&hl=es-419&gl=PE&ceid=PE:es"
    dynamic_source: true
    filter_keywords:
      - minería
      - minera
      - minero
      - mineras
      - MINEM
      - INGEMMET

  - id: mineria_pan_americana
    name: "Minería Pan-Americana"
    country: PE
    category: noticias
    homepage: "https://mineria-pa.com"
    feed_url: "https://mineria-pa.com/feed/"

  # ---------- ПЕРУ: широкие деловые СМИ, отфильтрованные по ключевым словам ----------
  # Это фиды ВСЕЙ категории "Экономика" (курс доллара, потребление, политика).
  # filter_keywords оставляет только пункты с точными отраслевыми терминами --
  # НЕ используем одиночные "oro"/"cobre" (ловят ювелирку, кулинарию, украшения),
  # только сочетания, однозначно указывающие на горную отрасль.
  - id: gestion_economia
    name: "Gestión - Economía (фильтр: минерка)"
    country: PE
    category: noticias
    homepage: "https://gestion.pe/rss/"
    feed_url: "https://gestion.pe/arc/outboundfeeds/rss/category/economia/?outputType=xml"
    filter_keywords:
      - minería
      - minera
      - minero
      - MINEM
      - INGEMMET
      - SUNAFIL
      - OEFA
      - concesión minera
      - proyecto minero
      - producción minera
      - precio del cobre
      - precio del oro
      - Buenaventura
      - Southern Copper
      - Antamina
      - Las Bambas
      - Cerro Verde
      - Minsur
      - Chinalco

  - id: elcomercio_economia
    name: "El Comercio - Economía (фильтр: минерка)"
    country: PE
    category: noticias
    homepage: "https://elcomercio.pe"
    feed_url: "https://elcomercio.pe/arc/outboundfeeds/rss/category/economia/?outputType=xml"
    filter_keywords:
      - minería
      - minera
      - minero
      - MINEM
      - INGEMMET
      - SUNAFIL
      - OEFA
      - concesión minera
      - proyecto minero
      - producción minera
      - precio del cobre
      - precio del oro
      - Buenaventura
      - Southern Copper
      - Antamina
      - Las Bambas
      - Cerro Verde
      - Minsur
      - Chinalco

  # ---------- ПЕРУ: нормативка (самое ценное для аудитории INFOSET) ----------
  # Это страницы поиска / списки на gob.pe -- не RSS, к тому же сайт блокирует
  # автоматические запросы (418 error). Нужен HTML от пользователя вручную,
  # чтобы написать точный scraper под структуру страницы.
  - id: elperuano_normas
    name: "El Peruano - Normas Legales"
    country: PE
    category: normativa
    homepage: "https://diariooficial.elperuano.pe/Normas"
    feed_url: null
    needs_custom_scraper: true

  - id: minem_noticias
    name: "MINEM - Noticias"
    country: PE
    category: normativa
    homepage: "https://www.gob.pe/institucion/minem/noticias"
    feed_url: null
    scraper: gobpe
    # MINEM публикует и про минерку, и про энергетику/топливо -- фильтруем
    filter_keywords:
      - minería
      - minera
      - minero
      - mineras
      - concesión
      - formalización minera
      - INGEMMET
      - producción minera
      - exportaciones mineras
      - inversión minera

  - id: minam_noticias
    name: "MINAM - Noticias"
    country: PE
    category: normativa
    homepage: "https://www.gob.pe/institucion/minam/noticias"
    feed_url: null
    scraper: gobpe
    # MINAM публикует про экологию в целом -- фильтруем на пересечение с минеркой
    filter_keywords:
      - minería
      - minera
      - minero
      - mineras
      - OEFA
      - pasivo ambiental
      - fiscalización ambiental minera
      - relaves
      - concesión minera

  # ---------- МЕЖДУНАРОДНЫЕ (подтверждённые RSS) ----------
  - id: mining_com
    name: "Mining.com"
    country: INTL
    category: internacional
    homepage: "https://www.mining.com"
    feed_url: "https://www.mining.com/feed/"
    lang: en

  - id: im_mining
    name: "International Mining"
    country: INTL
    category: internacional
    homepage: "https://im-mining.com"
    feed_url: "https://im-mining.com/feed"
    lang: en

  - id: emj
    name: "Engineering & Mining Journal"
    country: INTL
    category: internacional
    homepage: "https://e-mj.com"
    feed_url: "https://e-mj.com/feed"
    lang: en
