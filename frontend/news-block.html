<!--
  Новостной блок для infoset.org.pe в стиле ukr.net
  (список: дата + заголовок-ссылка + источник серым, без буллетов,
  первые 5 всегда видны, остальное разворачивается по клику)

  Требует: Supabase JS client. Добавь перед </body>, если ещё нет:
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  Это НЕ iframe -- код вставляется прямо в HTML страницы, поэтому
  наследует шрифты и стили твоего сайта, как обычный блок контента.
-->

<section id="infoset-news" class="py-5">
  <div class="container" style="max-width: 720px;">
    <div id="news-list"><!-- рендерится через JS ниже --></div>
  </div>
</section>

<style>
  #infoset-news h3 {
    font-size: 1.1rem;
    font-weight: 700;
    text-decoration: underline;
    margin: 1.5rem 0 0.75rem;
  }
  #infoset-news h3:first-child {
    margin-top: 0;
  }
  #infoset-news ul {
    list-style: none;
    padding-left: 0;
    margin: 0;
  }
  #infoset-news li {
    margin-bottom: 0.55rem;
    line-height: 1.35;
  }
  #infoset-news a {
    color: #1a0dab;
    text-decoration: none;
  }
  #infoset-news a:hover {
    text-decoration: underline;
  }
  #infoset-news .news-date {
    color: #666;
    font-size: 0.85em;
    margin-right: 0.4em;
    white-space: nowrap;
  }
  #infoset-news .news-source {
    color: #888;
    font-size: 0.9em;
  }
  #infoset-news .news-toggle {
    background: none;
    border: none;
    color: #1a0dab;
    font-size: 0.9em;
    cursor: pointer;
    padding: 0.3rem 0 1rem;
    display: inline-block;
  }
  #infoset-news .news-toggle:hover {
    text-decoration: underline;
  }
  #infoset-news .news-more {
    display: none;
  }
  #infoset-news .news-more.expanded {
    display: block;
  }
</style>

<script>
  const SUPABASE_URL = "https://YOUR_PROJECT.supabase.co"; // TODO: заменить
  const SUPABASE_ANON_KEY = "YOUR_ANON_KEY";                // TODO: заменить

  const VISIBLE_COUNT = 5; // сколько новостей видно сразу в каждой категории

  // Красивые названия источников (id из sources.yaml -> подпись на сайте)
  const SOURCE_LABELS = {
    rumbominero: "Rumbo Minero",
    energiminas: "Energiminas",
    proactivo: "Proactivo",
    mineria_pan_americana: "Minería Pan-Americana",
    gestion_economia: "Gestión",
    elcomercio_economia: "El Comercio",
    minem_noticias: "MINEM",
    minam_noticias: "MINAM",
    mining_com: "Mining.com",
    im_mining: "International Mining",
    emj: "E&MJ",
  };

  const CATEGORY_LABELS = {
    noticias: "Noticias del sector",
    normativa: "Normativa y regulación",
    internacional: "Internacional",
  };

  const MONTHS_ES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];

  async function loadNews() {
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const { data, error } = await client
      .from("news_items")
      .select("title,url,published_at,category,source")
      .order("published_at", { ascending: false })
      .limit(300);

    if (error) {
      console.error("Error cargando noticias:", error);
      return;
    }

    renderList(data || []);
  }

  function renderList(items) {
    const grouped = {};
    for (const item of items) {
      (grouped[item.category] ??= []).push(item);
    }

    const container = document.getElementById("news-list");
    container.innerHTML = "";

    for (const [category, label] of Object.entries(CATEGORY_LABELS)) {
      const categoryItems = grouped[category] || [];
      if (categoryItems.length === 0) continue;

      const heading = document.createElement("h3");
      heading.textContent = label;
      container.appendChild(heading);

      const visibleItems = categoryItems.slice(0, VISIBLE_COUNT);
      const restItems = categoryItems.slice(VISIBLE_COUNT);

      const ul = document.createElement("ul");
      ul.innerHTML = visibleItems.map(renderItem).join("");
      container.appendChild(ul);

      if (restItems.length > 0) {
        const moreId = `news-more-${category}`;
        const moreUl = document.createElement("ul");
        moreUl.className = "news-more";
        moreUl.id = moreId;
        moreUl.innerHTML = restItems.map(renderItem).join("");
        container.appendChild(moreUl);

        const toggle = document.createElement("button");
        toggle.className = "news-toggle";
        toggle.type = "button";
        toggle.textContent = `Mostrar todas las noticias (${restItems.length} más)`;
        toggle.addEventListener("click", () => {
          const isExpanded = moreUl.classList.toggle("expanded");
          toggle.textContent = isExpanded
            ? "Mostrar menos"
            : `Mostrar todas las noticias (${restItems.length} más)`;
        });
        container.appendChild(toggle);
      }
    }
  }

  function renderItem(item) {
    const sourceLabel = SOURCE_LABELS[item.source] || item.source;
    return `
      <li>
        <span class="news-date">${formatDate(item.published_at)}</span>
        <a href="${item.url}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.title)}</a>
        <span class="news-source">(${escapeHtml(sourceLabel)})</span>
      </li>`;
  }

  function formatDate(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    return `${d.getDate()} ${MONTHS_ES[d.getMonth()]}`;
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str || "";
    return div.innerHTML;
  }

  document.addEventListener("DOMContentLoaded", loadNews);
</script>
