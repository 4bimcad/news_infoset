name: Fetch news

on:
  schedule:
    # каждые 45 минут -- держит Supabase free-tier проект "живым"
    # (авто-пауза наступает только после 7 дней БЕЗ обращений к БД)
    - cron: "*/45 * * * *"
  workflow_dispatch: {}   # можно запустить вручную из вкладки Actions

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install feedparser pyyaml requests

      - name: Run fetcher
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/fetch_news.py
